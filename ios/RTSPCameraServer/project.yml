name: RTSPCameraServer
options:
  bundleIdPrefix: com.sianci.rtspcameraserver
targets:
  RTSPCameraServer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        NSCameraUsageDescription: "Used to stream the camera over RTSP."
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sianci.rtspcameraserver
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z282G33Q4X
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
